[project]
name = "optidieta"
version = "0.1.0"
description = "Dieta más barata con productos de Mercadona, nutrientes BEDCA y Open Food Facts"
readme = "README.md"
authors = [
    { name = "feal-ca" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[project.scripts]
optidieta = "optidieta.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
